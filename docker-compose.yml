services:
  nginx:
    image: nginx:alpine
    container_name: garudanexabahtera-nginx
    ports:
      - "127.0.0.1:3010:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/var/www/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.node
    container_name: garudanexabahtera-api
    volumes:
      - ./dist:/var/www/html:rw
      - pd_storage:/data/project-docs
    # Secrets come from .env next to this file (see .env.example)
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DB=${MYSQL_DB:-db_garudanexabahtera}
      - MYSQL_USER=root
      - MYSQL_PASS=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://is3.cloudhost.id}
      - S3_BUCKET=${S3_BUCKET:-garudanexa}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-https://is3.cloudhost.id/garudanexa}
      # Login tokens are signed with AUTH_SECRET; changing it logs everyone out
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -hex 32)}
      - AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-28800}
      # Encrypts list_products.users (product login accounts); empty = those accounts cannot be read or saved
      - LIST_PRODUCTS_KEY=${LIST_PRODUCTS_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - UPLOAD_MAX_IMAGE_MB=${UPLOAD_MAX_IMAGE_MB:-10}
      - UPLOAD_MAX_FILE_MB=${UPLOAD_MAX_FILE_MB:-25}
      # Hero background video (upload_hero_video); keep it below client_max_body_size in nginx.conf (64m)
      - UPLOAD_MAX_VIDEO_MB=${UPLOAD_MAX_VIDEO_MB:-30}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      # Nexa AI, public chat on the home page (backend/modules/nexa.js); empty key = built-in answers only
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NEXA_MODEL=${NEXA_MODEL:-}
      - NEXA_DAILY_LIMIT=${NEXA_DAILY_LIMIT:-}
      - NEXA_KNOWLEDGE_FILE=${NEXA_KNOWLEDGE_FILE:-}
      # Midtrans Snap for template orders; empty server key = orders without online payment (see .env.example)
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-0}
      - MIDTRANS_SIMULATOR=${MIDTRANS_SIMULATOR:-0}
      - APP_URL=${APP_URL:-}
      # Private project-document files (e-signatures, payment proofs): outside the web root, kept in a volume
      - PD_STORAGE_DIR=/data/project-docs
      - NODE_ENV=production
    depends_on:
      - mysql
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.0
    container_name: garudanexabahtera-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=${MYSQL_DB:-db_garudanexabahtera}
    volumes:
      - mysql_data:/var/lib/mysql
      # Only used when the mysql_data volume is created; no admin account is seeded (see database/README.md)
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "127.0.0.1:3309:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

volumes:
  mysql_data:
  pd_storage:

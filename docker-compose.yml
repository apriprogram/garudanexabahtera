services:
  nginx:
    image: nginx:alpine
    container_name: garudanexabahtera-nginx
    ports:
      - "127.0.0.1:3010:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/var/www/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.node
    container_name: garudanexabahtera-api
    volumes:
      - ./dist:/var/www/html:rw
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DB=db_garudanexabahtera
      - MYSQL_USER=root
      - MYSQL_PASS=garuda2024
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-isi-key-disini}
      - S3_ACCESS_KEY=7E1S8S9S8S7S6S5S4S3S2
      - S3_SECRET_KEY=isi-secret-key-disini-nanti
      - S3_ENDPOINT=https://is3.cloudhost.id
      - S3_BUCKET=garudanexa
      - S3_REGION=us-east-1
    depends_on:
      - mysql
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.0
    container_name: garudanexabahtera-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=garuda2024
      - MYSQL_DATABASE=db_garudanexabahtera
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:3309:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

volumes:
  mysql_data:

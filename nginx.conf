server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;
    server_tokens off;

    # Security headers. add_header is not inherited by a location that sets its own add_header,
    # so the locations below that add Cache-Control repeat these lines.
    # HSTS belongs on the TLS-terminating proxy in front of this container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Template payments use Midtrans Snap (redirect to app[.sandbox].midtrans.com, back via APP_URL/akun/pesanan/...):
    # payment and form-action allow the Midtrans origins so the Snap page / popup and its 3-D Secure forms keep working.
    add_header Permissions-Policy 'camera=(), microphone=(self), geolocation=(), payment=(self "https://app.midtrans.com" "https://app.sandbox.midtrans.com")' always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://app.midtrans.com https://app.sandbox.midtrans.com" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Never serve dotfiles (.env, .git, .htaccess) or dumps/scripts/logs that end up in the web root
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }
    location ~* \.(sql|env|log|bak|sh|php|ini|ya?ml)$ {
        deny all;
        return 404;
    }

    # Handle PHP API requests → Node.js backend
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64m;
    }

    # Handle PHP API requests → Node.js backend.
    # Exact match wins over the regex locations below (\.php$ deny), so every method and query string
    # reaches Node, including Midtrans' webhook: POST /api.php?action=midtrans_notification (JSON, no token).
    location = /api.php {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64m;
    }

    # Client project files: staff download them through /api.php?action=download_project_file.
    # ^~ keeps the image/script regex location below from serving them; dokumen-client/logo/ stays public.
    location ^~ /assets/dokumen-client/dokumen/ {
        return 403;
    }
    location = /assets/dokumen-client/dokumen {
        return 403;
    }

    # Static assets - long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # robots.txt & sitemap.xml
    location = /robots.txt {
        alias /var/www/html/robots.txt;
        expires 1d;
    }

    location = /sitemap.xml {
        alias /var/www/html/sitemap.xml;
        expires 1d;
        default_type application/xml;
    }
}

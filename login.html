<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Garuda Nexa Bahtera</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="assets/img/logo/logogarudanexa.png">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- Left Side: Form -->
        <div class="login-form-side">
            <main class="login-content">
                <div class="main-logo-container">
                    <img src="assets/img/logo/logogarudanexa.png" alt="Garuda Nexa Logo" class="login-logo-main">
                </div>
                <h1>Login to your account</h1>
                <p>Enter your details to login.</p>

                <button class="social-login">
                    <img src="https://www.google.com/favicon.ico" alt="Google">
                    Continue with Google
                </button>

                <div class="divider">OR</div>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" placeholder="hello@example.com" required>
                        </div>
                        <div class="error-message">Mohon isi alamat email Anda</div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="passwordInput" placeholder="••••••••" required>
                            <i data-lucide="eye" class="password-toggle" id="passwordToggle"></i>
                        </div>
                        <div class="error-message">Mohon isi kata sandi Anda</div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-group">
                            <input type="checkbox" id="rememberMe">
                            Keep me logged in
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-login">Login</button>

                    <div class="register-link-bottom">
                        Don't have an account? <a href="register.html">Register</a>
                    </div>
                </form>
            </main>
        </div>

        <!-- Right Side: Visual -->
        <div class="login-visual-side" style="background-image: url('assets/img/bg/hero.png');">
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Password Visibility Toggle with Event Delegation
        document.addEventListener('click', (e) => {
            if (e.target.closest('#passwordToggle')) {
                const passwordInput = document.getElementById('passwordInput');
                const passwordToggle = document.getElementById('passwordToggle');
                
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle icon name
                const iconName = type === 'password' ? 'eye' : 'eye-off';
                passwordToggle.setAttribute('data-lucide', iconName);
                
                // Refresh icons
                lucide.createIcons();
            }
        });

        // Email validation helper
        function validateEmail(email) {
            return String(email)
                .toLowerCase()
                .match(
                    /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
                );
        }

        // Custom Validation Logic
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;
            
            const inputs = loginForm.querySelectorAll('input[required]');

            inputs.forEach(input => {
                const wrapper = input.closest('.input-wrapper');
                const errorMessage = input.closest('.form-group').querySelector('.error-message');
                
                // Reset states
                wrapper.classList.remove('error', 'shake');
                errorMessage.style.display = 'none';

                if (!input.value.trim()) {
                    isValid = false;
                    wrapper.classList.add('error', 'shake');
                    errorMessage.innerText = input.type === 'email' ? "Mohon isi alamat email Anda" : "Mohon isi kata sandi Anda";
                    errorMessage.style.display = 'block';
                } else if (input.type === 'email' && !validateEmail(input.value)) {
                    isValid = false;
                    wrapper.classList.add('error', 'shake');
                    errorMessage.innerText = "Format email tidak valid (contoh: name@email.com)";
                    errorMessage.style.display = 'block';
                }
            });

            if (isValid) {
                const rememberMe = document.getElementById('rememberMe').checked;
                if (rememberMe) {
                    localStorage.setItem('keepLoggedIn', 'true');
                    localStorage.setItem('lastLogin', new Date().toISOString());
                } else {
                    localStorage.removeItem('keepLoggedIn');
                }
                window.location.href = 'index.html';
            }
        });

        // Clear error on input
        loginForm.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                const wrapper = input.closest('.input-wrapper');
                const errorMessage = input.closest('.form-group').querySelector('.error-message');
                wrapper.classList.remove('error', 'shake');
                errorMessage.style.display = 'none';
            });
        });

        // Check if user previously chose to keep logged in
        window.addEventListener('load', () => {
            const rememberMe = document.getElementById('rememberMe');
            if (rememberMe && localStorage.getItem('keepLoggedIn') === 'true') {
                rememberMe.checked = true;
            }
        });

        // Background Slider
        const images = [
            'assets/img/bg/hero.png',
            'assets/img/bg/hero1.png',
            'assets/img/bg/hero2.png',
            'assets/img/bg/hero3.png'
        ];
        let currentIndex = 0;
        const visualSide = document.querySelector('.login-visual-side');

        function changeBackground() {
            currentIndex = (currentIndex + 1) % images.length;
            visualSide.style.backgroundImage = `url('${images[currentIndex]}')`;
        }

        // Change background every 4 seconds
        setInterval(changeBackground, 4000);
    </script>
</body>
</html>

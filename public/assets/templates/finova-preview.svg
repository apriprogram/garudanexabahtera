  <radialGradient id="glow" cx="0.72" cy="0.42" r="0.45"><stop offset="0" stop-color="#D4F27A" stop-opacity="0.22"/><stop offset="1" stop-color="#D4F27A" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0 L0 0 0 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/></pattern>
  <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3B36"/><stop offset="1" stop-color="#17231F"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4EED8"/><stop offset="1" stop-color="#C9D6C0"/></linearGradient>
  <clipPath id="win"><rect x="80" y="60" width="1440" height="880" rx="24"/></clipPath>
  <clipPath id="hero"><rect x="100" y="80" width="1400" height="610" rx="32"/></clipPath>
  <clipPath id="frame"><rect x="930" y="170" width="400" height="430" rx="24"/></clipPath>
</defs>

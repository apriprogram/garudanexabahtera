<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Pratinjau sementara template Finova">
<!-- Placeholder fondasi 2026-10-22: diganti tangkapan layar demo asli oleh verifier. Tata letak = brief §4.3
     (panel hero gelap berkisi dengan menu di dalamnya, foto tangan + kartu dengan kartu UI melayang, bukti sosial
     dan strip mitra di dalam panel). Simbol = FinovaMark (atap lumbung menaungi koin), bukan logo referensi. -->
<defs>

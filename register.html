<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Garuda Nexa Bahtera</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="assets/img/logo/logogarudanexa.png">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- Left Side: Form -->
        <div class="login-form-side">
            <main class="login-content">
                <div class="main-logo-container">
                    <img src="assets/img/logo/logogarudanexa.png" alt="Garuda Nexa Logo" class="login-logo-main">
                </div>
                <h1>Create an account</h1>
                <p>Sign up to get started with Garuda Nexa.</p>

                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <i data-lucide="user"></i>
                            <input type="text" placeholder="Nama lengkap" required>
                        </div>
                        <div class="error-message">Mohon isi nama lengkap Anda</div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" placeholder="hello@example.com" required>
                        </div>
                        <div class="error-message">Mohon isi alamat email yang valid</div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="passwordInput" placeholder="••••••••" required>
                            <i data-lucide="eye" class="password-toggle" id="passwordToggle"></i>
                        </div>
                        <div class="error-message">Mohon isi kata sandi Anda</div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="shield-check"></i>
                            <input type="password" id="confirmPasswordInput" placeholder="••••••••" required>
                            <i data-lucide="eye" class="password-toggle" id="confirmPasswordToggle"></i>
                        </div>
                        <div class="error-message">Kata sandi tidak cocok</div>
                    </div>

                    <button type="submit" class="btn-login" style="margin-top: 1rem;">Create Account</button>

                    <div class="register-link-bottom">
                        Already have an account? <a href="login.html">Login</a>
                    </div>
                </form>
            </main>
        </div>

        <!-- Right Side: Visual -->
        <div class="login-visual-side" style="background-image: url('assets/img/bg/hero.png');">
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Password Visibility Toggle with Event Delegation
        document.addEventListener('click', (e) => {
            const toggle = e.target.closest('.password-toggle');
            if (toggle) {
                const inputId = toggle.id === 'passwordToggle' ? 'passwordInput' : 'confirmPasswordInput';
                const input = document.getElementById(inputId);
                
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                
                // Toggle icon name
                const iconName = type === 'password' ? 'eye' : 'eye-off';
                toggle.setAttribute('data-lucide', iconName);
                
                // Refresh icons
                lucide.createIcons();
            }
        });

        // Email validation helper
        function validateEmail(email) {
            return String(email)
                .toLowerCase()
                .match(
                    /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
                );
        }

        // Custom Validation Logic
        const registerForm = document.getElementById('registerForm');
        
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;
            
            const inputs = registerForm.querySelectorAll('input[required]');
            const pass = document.getElementById('passwordInput').value;
            const confirm = document.getElementById('confirmPasswordInput').value;

            inputs.forEach(input => {
                const wrapper = input.closest('.input-wrapper');
                const errorMessage = input.closest('.form-group').querySelector('.error-message');
                
                // Reset states
                wrapper.classList.remove('error', 'shake');
                errorMessage.style.display = 'none';

                if (!input.value.trim()) {
                    isValid = false;
                    wrapper.classList.add('error', 'shake');
                    errorMessage.style.display = 'block';
                } else if (input.type === 'email' && !validateEmail(input.value)) {
                    isValid = false;
                    wrapper.classList.add('error', 'shake');
                    errorMessage.innerText = "Format email tidak valid";
                    errorMessage.style.display = 'block';
                }
            });

            // Special check for password match
            if (isValid && pass !== confirm) {
                isValid = false;
                const confirmInput = document.getElementById('confirmPasswordInput');
                const confirmWrapper = confirmInput.closest('.input-wrapper');
                const confirmError = confirmInput.closest('.form-group').querySelector('.error-message');
                
                confirmWrapper.classList.add('error', 'shake');
                confirmError.innerText = "Kata sandi tidak cocok!";
                confirmError.style.display = 'block';
            }

            if (isValid) {
                alert('Account created successfully!');
                window.location.href = 'login.html';
            }
        });

        // Clear error on input
        registerForm.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                const wrapper = input.closest('.input-wrapper');
                const errorMessage = input.closest('.form-group').querySelector('.error-message');
                wrapper.classList.remove('error', 'shake');
                errorMessage.style.display = 'none';
            });
        });

        // Background Slider
        const images = [
            'assets/img/bg/hero.png',
            'assets/img/bg/hero1.png',
            'assets/img/bg/hero2.png',
            'assets/img/bg/hero3.png',
        ];
        let currentIndex = 0;
        const visualSide = document.querySelector('.login-visual-side');

        function changeBackground() {
            currentIndex = (currentIndex + 1) % images.length;
            visualSide.style.backgroundImage = `url('${images[currentIndex]}')`;
        }

        // Change background every 4 seconds
        setInterval(changeBackground, 4000);
    </script>
</body>
</html>
